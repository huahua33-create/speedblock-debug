plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debug.speedblock'
    compileSdk 34

    defaultConfig {
        applicationId "com.debug.speedblock"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
